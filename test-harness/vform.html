<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>vForm harness</title>
<link rel="stylesheet" href="../style.css?v=20261106-4">
<style>
#testbar{position:sticky;top:0;z-index:999;background:#111;color:#fff;padding:.5rem;font:11px monospace;white-space:pre-wrap}
#testbar.ok{background:#1b5e20}#testbar.fail{background:#b71c1c}
#modebar,#tabbar{display:none!important}
main{max-width:390px;margin:0 auto}
</style></head><body>
<div id="testbar">harness…</div>
<header id="topbar"><a class="brand" href="#">🥫 Vorratskammer</a>
<span class="who"><span id="who">test@example.com</span><button id="logoutBtn" class="btn-link" type="button">Abmelden</button></span></header>
<main id="app"></main><div id="toast" class="hidden"></div>
<script>
window.__errors=[]; window.__HARNESS=true;
window.addEventListener('error',e=>window.__errors.push(String(e.message||e)));
window.addEventListener('unhandledrejection',e=>window.__errors.push(String(e.reason)));
window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null}}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signOut:async()=>({})},
from(){const a={select(){return a},eq(){return a},order(){return a},insert(){return a},update(){return a},delete(){return a},single:async()=>({data:null,error:null}),then(r){return Promise.resolve({data:[],error:null}).then(r)}};return a},
rpc:async()=>({data:null,error:null}),storage:{from(){return{upload:async()=>({}),remove:async()=>({}),createSignedUrl:async()=>({data:{signedUrl:''}})}}}})};
</script>
<script src="../app.js?v=20261106-4"></script>
<script src="../offers.js?v=20261106-4"></script>
<script>
(async()=>{
const bar=document.getElementById('testbar');
try{
  state.user={id:'u1',email:'test@example.com'}; state.viewUid='u1'; state.loaded=true;
  vstate.loaded=true; vstate.orte=[]; vstate.items=[]; vstate.chargen={};
  document.getElementById('topbar').classList.remove('hidden');
  vForm('neu');
  // Structure: one input each, no select in .suggest
  const katSuggest=document.querySelector('[data-suggest=kat]');
  const einSuggest=document.querySelector('[data-suggest=ein]');
  const katInputs=katSuggest.querySelectorAll('input');
  const einInputs=einSuggest.querySelectorAll('input');
  const katSelects=katSuggest.querySelectorAll('select');
  const einSelects=einSuggest.querySelectorAll('select');
  const katLists=katSuggest.querySelectorAll('datalist');
  const einLists=einSuggest.querySelectorAll('datalist');
  const structOk=katInputs.length===1&&einInputs.length===1&&katSelects.length===0&&einSelects.length===0&&katLists.length===1&&einLists.length===1
    && document.getElementById('kat').getAttribute('list')==='katList'
    && document.getElementById('ein').getAttribute('list')==='einList';

  const name=document.getElementById('name');
  name.value='Milch';
  name.dispatchEvent(new Event('input',{bubbles:true}));
  name.dispatchEvent(new Event('change',{bubbles:true}));
  await new Promise(r=>setTimeout(r,700));
  document.getElementById('kat').value='';
  document.getElementById('ein').value='Stück';
  document.getElementById('min').value='';
  document.getElementById('applyHint').click();
  await new Promise(r=>setTimeout(r,100));
  const after={
    kat:document.getElementById('kat').value,
    ein:document.getElementById('ein').value,
    min:document.getElementById('min').value,
    katW:Math.round(document.getElementById('kat').getBoundingClientRect().width),
    visibleControls: document.querySelectorAll('[data-suggest=kat] input, [data-suggest=kat] select, [data-suggest=ein] input, [data-suggest=ein] select').length,
  };
  // Milch -> Milchprodukte + l (dict)
  const applyOk=after.kat==='Milchprodukte'&&after.ein==='l'&&after.visibleControls===2&&after.katW>=280;
  // manual type still works
  document.getElementById('kat').value='Eigenkat';
  document.getElementById('kat').dispatchEvent(new Event('input',{bubbles:true}));
  const customOk=document.getElementById('kat').value==='Eigenkat';

  const result={structOk,applyOk,customOk,after,errors:window.__errors.slice()};
  window.__testResult=result;
  const ok=structOk&&applyOk&&customOk&&!window.__errors.length;
  bar.className=ok?'ok':'fail';
  bar.textContent=(ok?'PASS ':'FAIL ')+JSON.stringify(result);
  console.log('TEST_RESULT',result);
}catch(e){bar.className='fail';bar.textContent='FAIL '+e;window.__testResult={error:String(e)};console.error(e)}
})();
</script></body></html>
